<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Football Quiz Certificate Preview Gallery</title>
  <style>
    :root {
      --text: #f3f6fb;
      --muted: #a8b4c7;
      --line: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(88, 166, 255, 0.12), transparent 32%),
        radial-gradient(circle at top right, rgba(255, 209, 102, 0.08), transparent 26%),
        linear-gradient(180deg, #0d1117 0%, #0a0f15 100%);
      color: var(--text);
    }

    .page {
      width: min(1560px, calc(100% - 40px));
      margin: 0 auto;
      padding: 32px 0 56px;
    }

    .hero {
      padding: 24px 28px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: rgba(18, 25, 34, 0.82);
      backdrop-filter: blur(18px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.22);
    }

    .hero-toolbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    .hero-copy {
      flex: 1 1 720px;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 44px);
      line-height: 1.02;
      letter-spacing: -0.03em;
    }

    .hero p {
      margin: 12px 0 0;
      max-width: 860px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.6;
    }

    .lang-switcher {
      display: inline-flex;
      gap: 8px;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      flex: 0 0 auto;
    }

    .lang-btn {
      border: none;
      border-radius: 999px;
      padding: 9px 14px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
    }

    .lang-btn.active {
      background: rgba(255, 255, 255, 0.12);
      color: var(--text);
      transform: translateY(-1px);
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    .legend-chip {
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      background: rgba(255, 255, 255, 0.03);
    }

    .section {
      margin-top: 28px;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 22px;
      letter-spacing: -0.02em;
    }

    .section-title span {
      color: var(--muted);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 18px;
    }

    .preview-shell {
      border-radius: 32px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 22px 70px rgba(0, 0, 0, 0.28);
      min-height: 840px;
      position: relative;
    }

    .preview-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.95;
    }

    .preview-inner {
      position: relative;
      z-index: 1;
      min-height: 840px;
      padding: 20px 20px 28px;
    }

    .preview-top {
      position: relative;
      min-height: 142px;
    }

    .back-btn {
      position: absolute;
      top: 0;
      left: 0;
      width: 44px;
      height: 44px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      font-size: 18px;
      font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    .trophy {
      width: 56px;
      height: 56px;
      margin: 22px auto 0;
      display: grid;
      place-items: center;
      font-size: 34px;
      line-height: 1;
      transform-origin: center;
    }

    .caption {
      margin-top: 8px;
      text-align: center;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.20em;
      text-transform: uppercase;
    }

    .headline {
      margin-top: 2px;
      text-align: center;
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .subheadline {
      margin-top: 4px;
      text-align: center;
      font-size: 14px;
      font-style: italic;
      line-height: 1.5;
    }

    .certificate-card {
      margin-top: 22px;
      border-radius: 28px;
      padding: 20px;
    }

    .ornament {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ornament-line {
      height: 1px;
      flex: 1;
    }

    .ornament-diamond {
      width: 6px;
      height: 6px;
      transform: rotate(45deg);
      flex: 0 0 auto;
    }

    .label {
      margin-top: 16px;
      text-align: center;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .recipient {
      margin-top: 14px;
      text-align: center;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 28px;
      font-weight: 700;
      line-height: 1.1;
    }

    .divider {
      width: 110px;
      height: 2px;
      margin: 8px auto 0;
    }

    .awarded,
    .award-text {
      text-align: center;
    }

    .awarded {
      margin-top: 16px;
      font-size: 13px;
    }

    .award-text {
      margin-top: 4px;
      font-size: 13px;
      line-height: 1.55;
    }

    .stage-chip {
      margin-top: 14px;
      padding: 10px 16px;
      border-radius: 18px;
      text-align: center;
      font-size: 17px;
      font-weight: 800;
      line-height: 1.4;
    }

    .additional-title {
      margin-top: 14px;
      text-align: center;
      font-size: 12px;
      font-weight: 800;
    }

    .additional-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
    }

    .additional-chip {
      border-radius: 16px;
      padding: 8px 12px;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .meta-divider,
    .signature-divider {
      height: 1px;
      margin-top: 20px;
    }

    .signature-divider {
      margin-top: 16px;
    }

    .meta-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      margin-top: 16px;
    }

    .meta-label {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.10em;
      text-transform: uppercase;
    }

    .meta-value {
      margin-top: 4px;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.45;
      word-break: break-word;
    }

    .meta-right {
      text-align: right;
    }

    .signature-label {
      margin-top: 14px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .signature-name {
      margin-top: 4px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 20px;
      font-weight: 700;
      font-style: italic;
    }

    .signature-role {
      margin-top: 2px;
      font-size: 11px;
    }

    .continue-btn {
      width: 100%;
      height: 54px;
      margin-top: 22px;
      border: none;
      border-radius: 20px;
      font-size: 16px;
      font-weight: 800;
      cursor: default;
    }

    .preview-meta {
      margin-top: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .preview-key {
      opacity: 0.86;
    }

    @media (max-width: 760px) {
      .page {
        width: min(100%, calc(100% - 20px));
        padding-top: 18px;
      }

      .hero {
        padding: 20px;
        border-radius: 22px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .preview-shell,
      .preview-inner {
        min-height: auto;
      }
    }
  </style>
</head>

        uefa_europa_league_complete: "ՈՒԵՖԱ: Եվրոպայի լիգա",
        uefa_champions_league_complete: "ՈՒԵՖԱ: Չեմպիոնների լիգա",
        uefa_european_championship_complete: "ՈՒԵՖԱ: Եվրոպայի առաջնություն",
        uefa_complete: "ՈՒԵՖԱ ավարտված է",
        world_complete: "Աշխարհը ավարտված է",
        versus_vsrm_complete: "Ընդդեմ: Ռոնալդու vs Մեսսի",
        versus_vsrb_complete: "Ընդդեմ: Ռեալ Մադրիդ vs Բարսելոնա",
        versus_complete: "Ընդդեմ ավարտված է",
        app_complete: "Football Quiz ավարտված է"
      }
    };

    const captions = {
      ru: { top5_stage: "ЭТАП TOP 5", top5_complete: "TOP 5 ЗАВЕРШЁН", uefa_stage: "ЭТАП УЕФА", uefa_complete: "УЕФА ЗАВЕРШЁН", world_complete: "МИР ЗАВЕРШЁН", versus_stage: "ЭТАП VERSUS", versus_complete: "VERSUS ЗАВЕРШЁН", app_complete: "ПОЛНОЕ ПРОХОЖДЕНИЕ" },
      en: { top5_stage: "TOP 5 STAGE", top5_complete: "TOP 5 COMPLETE", uefa_stage: "UEFA STAGE", uefa_complete: "UEFA COMPLETE", world_complete: "WORLD COMPLETE", versus_stage: "VERSUS STAGE", versus_complete: "VERSUS COMPLETE", app_complete: "ULTIMATE COMPLETION" },
      hy: { top5_stage: "TOP 5 ՓՈՒԼ", top5_complete: "TOP 5 ԱՎԱՐՏՎԱԾ Է", uefa_stage: "ՈՒԵՖԱ ՓՈՒԼ", uefa_complete: "ՈՒԵՖԱ ԱՎԱՐՏՎԱԾ Է", world_complete: "ԱՇԽԱՐՀԸ ԱՎԱՐՏՎԱԾ Է", versus_stage: "VERSUS ՓՈՒԼ", versus_complete: "VERSUS ԱՎԱՐՏՎԱԾ Է", app_complete: "ԱՄԲՈՂՋԱԿԱՆ ԱՎԱՐՏ" }
    };

    const subheadlines = {
      ru: { top5_stage: "Завершён новый футбольный этап Top 5.", top5_complete: "Полностью завершена вся коллекция Top 5.", uefa_stage: "Завершён новый этап УЕФА.", uefa_complete: "Полностью завершена вся коллекция УЕФА.", world_complete: "Полностью завершён мировой блок.", versus_stage: "Завершён новый challenge один на один.", versus_complete: "Все Versus-челленджи полностью завершены.", app_complete: "Завершены все ключевые этапы Football Quiz." },
      en: { top5_stage: "A new Top 5 football stage has been completed.", top5_complete: "The full Top 5 collection has been completed.", uefa_stage: "A new UEFA stage has been completed.", uefa_complete: "The full UEFA collection has been completed.", world_complete: "The World block has been fully completed.", versus_stage: "A new head-to-head challenge has been completed.", versus_complete: "All Versus challenges have been completed.", app_complete: "Every major Football Quiz stage has been completed." },
      hy: { top5_stage: "Ավարտվել է Top 5-ի նոր ֆուտբոլային փուլը։", top5_complete: "Top 5-ի ամբողջ հավաքածուն ամբողջությամբ ավարտված է։", uefa_stage: "Ավարտվել է ՈՒԵՖԱ-ի նոր փուլը։", uefa_complete: "ՈՒԵՖԱ-ի ամբողջ հավաքածուն ամբողջությամբ ավարտված է։", world_complete: "Աշխարհի բլոկը ամբողջությամբ ավարտված է։", versus_stage: "Ավարտվել է նոր մեկ-մեկի challenge-ը։", versus_complete: "Versus-ի բոլոր challenge-ները ամբողջությամբ ավարտված են։", app_complete: "Football Quiz-ի բոլոր հիմնական փուլերը ավարտված են։" }
    };

    let currentLang = localStorage.getItem("fq-certificate-preview-lang") || "ru";

    const blend = (hexA, hexB, amount) => {
      const a = hexToRgb(hexA);
      const b = hexToRgb(hexB);
      return `rgb(${Math.round(a.r + (b.r - a.r) * amount)}, ${Math.round(a.g + (b.g - a.g) * amount)}, ${Math.round(a.b + (b.b - a.b) * amount)})`;
    };

    const withAlpha = (hex, alpha) => {
      const { r, g, b } = hexToRgb(hex);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    };

    function hexToRgb(hex) {
      const normalized = hex.replace("#", "");
      const value = normalized.length === 3
        ? normalized.split("").map((part) => part + part).join("")
        : normalized;
      return {
        r: parseInt(value.slice(0, 2), 16),
        g: parseInt(value.slice(2, 4), 16),
        b: parseInt(value.slice(4, 6), 16)
      };
    }

    function stageKey(stageId) {
      if (stageId === "top5_complete") return "top5_complete";
      if (stageId.startsWith("top5_")) return "top5_stage";
      if (stageId === "uefa_complete") return "uefa_complete";
      if (stageId.startsWith("uefa_")) return "uefa_stage";
      if (stageId === "world_complete") return "world_complete";
      if (stageId === "versus_complete") return "versus_complete";
      if (stageId.startsWith("versus_")) return "versus_stage";
      return "app_complete";
    }

    function getAdditional(stageId) {
      const mapping = {
        top5_complete: ["top5_france_complete", "top5_germany_complete", "top5_italy_complete", "top5_england_complete", "top5_spain_complete"],
        uefa_complete: ["uefa_super_cup_complete", "uefa_europa_league_complete", "uefa_champions_league_complete", "uefa_european_championship_complete"],
        versus_complete: ["versus_vsrm_complete", "versus_vsrb_complete"],
        app_complete: ["top5_complete", "uefa_complete", "world_complete", "versus_complete"]
      };
      return (mapping[stageId] || []).map((id) => titles[currentLang][id]);
    }

    function renderPreview(stageId) {
      const theme = themes[stageId];
      const text = ui[currentLang];
      const overlayStart = blend(theme.screen, "#FFFFFF", theme.major ? 0.06 : 0.03);
      const overlayEnd = blend(theme.screen, "#000000", theme.major ? 0.58 : 0.45);
      const backFill = blend(theme.screen, "#FFFFFF", 0.10);
      const addFill = blend(theme.cardFill, theme.accent, 0.18);
      const stageFont = theme.major ? 18 : 17;
      const headlineSize = theme.major ? 36 : 34;
      const trophyScale = theme.major ? 1.12 : 1;
      const additional = getAdditional(stageId);
      const certId = `FQ-${stageId.replaceAll("_", "-").toUpperCase().slice(0, 18)}-240619`;

      return `
        <article class="preview-shell" style="background:${theme.screen}">
          <div class="preview-overlay" style="background:linear-gradient(180deg, ${overlayStart} 0%, ${overlayEnd} 100%)"></div>
          <div class="preview-inner">
            <div class="preview-top">
              <div class="back-btn" style="background:${backFill}; color:${theme.primary}; border-color:${withAlpha(theme.primary, 0.28)}">←</div>
              <div class="trophy" style="color:${theme.emphasis}; transform:scale(${trophyScale})">🏆</div>
              <div class="caption" style="color:${withAlpha(theme.primary, 0.76)}">${captions[currentLang][stageKey(stageId)]}</div>
              <div class="headline" style="color:${theme.primary}; font-size:${headlineSize}px">${text.headline}</div>
              <div class="subheadline" style="color:${theme.secondary}">${subheadlines[currentLang][stageKey(stageId)]}</div>
            </div>

            <div class="certificate-card" style="background:${theme.cardFill}; border:${theme.major ? 2.5 : 1.5}px solid ${theme.cardStroke}">
              <div class="ornament">
                <div class="ornament-line" style="background:${withAlpha(theme.accent, 0.40)}"></div>
                <div class="ornament-diamond" style="background:${theme.accent}"></div>
                <div class="ornament-line" style="background:${withAlpha(theme.accent, 0.40)}"></div>
              </div>

              <div class="label" style="color:${withAlpha(theme.primary, 0.68)}">${text.label}</div>
              <div class="recipient" style="color:${theme.primary}">${recipientName}</div>
              <div class="divider" style="background:${theme.accent}"></div>
              <div class="awarded" style="color:${theme.secondary}">${text.awarded}</div>
              <div class="award-text" style="color:${withAlpha(theme.secondary, 0.90)}">${text.awardText}</div>
              <div class="stage-chip" style="background:${theme.chipFill}; color:${theme.chipText}; font-size:${stageFont}px">${titles[currentLang][stageId]}</div>

              ${additional.length ? `
                <div class="additional-title" style="color:${theme.emphasis}">${text.additional(additional.length)}</div>
                <div class="additional-list">
                  ${additional.map((item) => `
                    <div class="additional-chip" style="background:${addFill}; color:${theme.primary}; border-color:${withAlpha(theme.primary, 0.22)}">${item}</div>
                  `).join("")}
                </div>
              ` : ""}

              <div class="meta-divider" style="background:${withAlpha(theme.primary, 0.24)}"></div>
              <div class="meta-grid">
                <div>
                  <div class="meta-label" style="color:${withAlpha(theme.primary, 0.64)}">${text.issuedOnLabel}</div>
                  <div class="meta-value" style="color:${theme.primary}">${text.issuedOnValue}</div>
                </div>
                <div class="meta-right">
                  <div class="meta-label" style="color:${withAlpha(theme.primary, 0.64)}">${text.certificateIdLabel}</div>
                  <div class="meta-value" style="color:${theme.primary}">${certId}</div>
                </div>
              </div>

              <div class="signature-divider" style="background:${withAlpha(theme.accent, 0.25)}"></div>
              <div class="signature-label" style="color:${withAlpha(theme.primary, 0.64)}">${text.signatureLabel}</div>
              <div class="signature-name" style="color:${theme.emphasis}">${recipientName}</div>
              <div class="signature-role" style="color:${withAlpha(theme.secondary, 0.86)}">${text.signatureRole}</div>

              <div class="ornament" style="margin-top:16px">
                <div class="ornament-line" style="background:${withAlpha(theme.accent, 0.40)}"></div>
                <div class="ornament-diamond" style="background:${theme.accent}"></div>
                <div class="ornament-line" style="background:${withAlpha(theme.accent, 0.40)}"></div>
              </div>
            </div>

            <button class="continue-btn" style="background:linear-gradient(90deg, ${theme.buttonFill} 0%, ${blend(theme.buttonFill, "#FFFFFF", 0.08)} 100%); color:${theme.buttonText}; box-shadow:0 12px 26px ${withAlpha(theme.buttonFill, 0.18)}">${text.continueButton}</button>

            <div class="preview-meta">
              <span>${theme.major ? text.majorAchievement : text.stageAchievement}</span>
              <span class="preview-key">${stageId}</span>
            </div>
          </div>
        </article>
      `;
    }

    function renderStaticCopy() {
      const text = ui[currentLang];
      document.documentElement.lang = currentLang;
      document.title = text.pageTitle;
      document.getElementById("heroTitle").textContent = text.heroTitle;
      document.getElementById("heroText").textContent = text.heroText;
      document.getElementById("legend1").textContent = text.legend1;
      document.getElementById("legend2").textContent = text.legend2;
      document.getElementById("legend3").textContent = text.legend3;
      document.getElementById("sectionTitle").textContent = text.sectionTitle;
      document.getElementById("sectionMeta").textContent = text.sectionMeta;
    }

    function renderButtons() {
      document.querySelectorAll(".lang-btn").forEach((button) => {
        button.classList.toggle("active", button.dataset.lang === currentLang);
      });
    }

    function renderGallery() {
      document.getElementById("gallery").innerHTML = orderedStageIds.map(renderPreview).join("");
    }

    function setLanguage(lang) {
      if (!ui[lang]) return;
      currentLang = lang;
      localStorage.setItem("fq-certificate-preview-lang", lang);
      renderButtons();
      renderStaticCopy();
      renderGallery();
    }

    document.querySelectorAll(".lang-btn").forEach((button) => {
      button.addEventListener("click", () => setLanguage(button.dataset.lang));
    });

    setLanguage(ui[currentLang] ? currentLang : "ru");
  </script>
</body>
</html>
